<!doctype html>
<html lang="ru" class="page">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Yarizma</title>
		<link rel="stylesheet" href="css/index.css" />
		<link rel="shortcut icon" href="./icons/favicon.ico" type="image/x-icon" />
		<script type="module" src="./js/index.js"></script>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<a href="#" class="header__logo-link">
					<img
						src="./icons/logo.svg"
						alt="Логотип клуба Xarizma"
						width="293"
						height="67"
						loading="lazy"
				/></a>

				<div class="header__info">
					<a href="tel:+380979709090" class="header__phone-link">
						<svg class="header__phone-ico" width="27" height="27">
							<use href="./icons/sprite.svg#phone"></use>
						</svg>
						+38 (097) 970-90-90</a
					>
					<button
						class="header__location-btn header__location-btn--close"
						title="Открыть карту"
						arial-label="кнопка, которая открывает карту на точке м. Лубянка, ул. Сретенский переулок, 4"
						data-modal-button="location"
						data-modal-speed="300"
					>
						<svg class="header__location-ico" width="34" height="34">
							<use href="./icons/sprite.svg#location"></use>
						</svg>
						<span class="header__location-text">м. Лубянка</span>
					</button>
				</div>
				<div class="header__buttons-wrapper">
					<a
						class="header__button-rooms text-btn"
						href="#"
						title="Наши залы"
						aria-label="ссылка наши залы"
					>
						Наши залы</a
					>
					<button
						class="header__button-buy text-btn"
						title="Забронировать"
						aria-label="кнопка забронировать"
						data-modal-button="buy"
						data-modal-speed="300"
					>
						Забронировать
					</button>
				</div>
				<div class="burger-menu__wrapper">
					<button class="burger-menu" title="Меню" aria-label="Открыть меню">
						<span class="burger-menu__line"></span>
						<span class="burger-menu__line"></span>
					</button>
					<button
						class="burger__menu-cross"
						title="Закрыть"
						aria-label="Закрыть меню"
					>
						<img
							src="./icons/cross.svg"
							width="21"
							height="21"
							alt="Ораньжевый крестик, в виде кнопки, который закрывает бургер-меню"
							loading="lazy"
						/>
					</button>
				</div>
			</div>
		</header>
		<div class="hero">
			<div class="container hero__container">
				<p class="hero__text letter-sp-3">Арендуй Караоке-Зал до 10 человек</p>
				<h1 class="hero__title letter-sp-3">
					возьми алкоголь <span class="hero__title-nowrap">и еду с собой</span>
					<strong class="hero__title-addrress letter-sp-3">м. Лубянка</strong>
				</h1>
				<div class="hero__content">
					<div class="hero__content-benefits">
						<ul class="hero__benefits-list">
							<li class="hero__benefits-element">
								Если хочешь попеть и оторваться
							</li>
							<li class="hero__benefits-element">Отдохнуть после работы</li>
							<li class="hero__benefits-element">Хорошо провести время</li>
						</ul>
						<button
							class="hero__btn-buy letter-sp-5"
							title="Забронировать"
							aria-label="кнопка забронировать"
							data-modal-button="buy"
							data-modal-speed="300"
						>
							Забронировать онлайн
						</button>
					</div>
					<!-- <div class="hero__information">
						<p class="hero__information-text">Листайте вниз</p>
						<picture>
							<source srcset="./images/tag.webp" type="webp/img" />
							<img
								class="hero__information__img"
								src="./images/tag.png"
								width="269"
								height="273"
								alt="Круглосуточное разрешение на шум"
								loading="lazy"
							/>
						</picture>
						<p class="hero__information-img__text">
							Можно шуметь
							<span class="hero__information-img__text--accent"
								>Круглосуточно</span
							>
						</p>
						<a href="#!" class="hero__link" title="Связаться с нами"
							>Связаться с нами</a
						>
					</div> -->
				</div>
			</div>
		</div>
		<div class="modal">
			<div class="modal__window modal__location" data-modal-window="location">
				<button
					class="modal__close modal__close-location"
					title="Закрыть"
					aria-label="Закрыть"
					data-modal-close
				>
					<svg width="24" height="24">
						<use href="./icons/sprite.svg#cross"></use>
					</svg>
				</button>
				<div class="modal__content modal__location-content">
					<h3 class="modal__title-location">
						м. Лубянка, ул. Сретенский переулок, 4
					</h3>
					<iframe
						src="https://yandex.ru/map-widget/v1/?um=constructor%3Af7cb417d0a17e6e0592507b84cc55d9c9ef007acceadc57f87f442175ed93447&amp;source=constructor"
						width="500"
						height="400"
						frameborder="0"
						title="Карта"
					></iframe>
				</div>
			</div>
			<div class="modal__window modal__buy" data-modal-window="buy">
				<button
					class="modal__close modal__close-buy"
					title="Закрыть"
					aria-label="Закрыть"
					data-modal-close
				>
					<svg width="24" height="24">
						<use href="./icons/sprite.svg#cross"></use>
					</svg>
				</button>
				<div class="modal__content modal__buy-content">
					<form class="modal__form">
						<fieldset class="modal__form-wrapper">
							<legend class="modal__form-title">
								Забронировать место ОНЛАЙН
							</legend>
							<label class="modal__form-label" for="name"
								><input name="name" type="text" placeholder="Введите своё имя"
							/></label>

							<label class="modal__form-label" for="number">
								<input
									name="number"
									type="text"
									placeholder="Введите свой телефон"
							/></label>

							<label class="modal__form-label" for="email"
								><input
									name="email"
									type="email"
									placeholder="Введите свой email"
							/></label>
						</fieldset>
						<button class="modal__form-btn" type="submit">Забронировать</button>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>
